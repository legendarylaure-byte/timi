services:
  pipeline:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: timi-pipeline
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_WAIT_SECONDS=180
      - OLLAMA_VERIFY_RETRIES=8
      - OLLAMA_VERIFY_INTERVAL=6
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase/serviceAccountKey.json
    env_file:
      - ./agents/.env
    volumes:
      - ./firebase/serviceAccountKey.json:/app/firebase/serviceAccountKey.json:ro
      - ./agents/youtube_token.json:/app/youtube_token.json
      - ./agents/output:/app/output
      - ./agents/data:/app/data
      - ./keys/:/app/keys/:ro
      - ./agents/tmp/community_cookies/:/app/tmp/community_cookies/
      - ./agents/tmp/ltx_cache/:/app/tmp/ltx_cache/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
