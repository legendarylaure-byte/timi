name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly so a newly published advisory is caught even when nobody opens a PR.
  # Off the hour on purpose: every scheduled workflow on the planet fires at :00.
  schedule:
    - cron: '17 6 * * 1'

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Strict-zero, not baselined: the dashboard is at 0 advisories, so any new
      # one fails outright rather than waiting for someone to widen a baseline.
      - name: npm audit (strict zero)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          python3 ../.github/scripts/audit_gate.py npm /tmp/npm-audit.json

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  pipeline-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt
      # manimpango (a manim dep) has no wheel for this platform and builds from
      # source, so it needs the cairo/pango headers present or pip install dies
      # with "Package 'pangocairo' was not found". The Docker image has these.
      - name: Install manim system deps
        # ffmpeg is here for test_frozen_video.py, which shells out to it to
        # build fixtures. Without it 5 tests die on FileNotFoundError: 'ffmpeg'.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --tb=short
      - run: python -c "from utils.cost_tracker import log_llm_cost, get_cost_summary; log_llm_cost('test', 10, 5); s = get_cost_summary(); print('cost OK', s)"
      # Audits the env that was just installed, so this needs no second resolve.
      # --local is the shipped image's real package set, not a simulated one.
      - name: Dependency advisory gate
        run: |
          pip install -q pip-audit
          pip-audit --local --format=json --progress-spinner=off > /tmp/pip-audit.json || true
          python3 ../.github/scripts/audit_gate.py pip /tmp/pip-audit.json ../.github/dependency-audit-baseline.json
      - name: Audit gate self-check
        run: python3 ../.github/scripts/audit_gate.py --self-check

  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check dashboard is live
        run: |
          curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://timi.vyomai.cloud" | grep 200

  notify:
    needs: [lint, test, healthcheck]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "❌ **CI Failed** on `main`\nCommit: `${{ github.sha }}`\nMessage: ${{ github.event.head_commit.message || 'triggered' }}\nURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        if: env.SLACK_WEBHOOK != ''
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ CI Failed on `main`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }'
